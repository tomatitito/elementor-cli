name: Monitor Elementor Releases

on:
  schedule:
    # Run once daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-elementor-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for new Elementor release
        id: check
        run: |
          # Get latest release from WordPress.org plugin API (more reliable than GitHub)
          LATEST_RELEASE=$(curl -s "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&slug=elementor" | jq -r '.version')

          # Get our last known version
          LAST_KNOWN=$(cat .github/last-known-elementor-version.txt 2>/dev/null || echo "")

          echo "Latest Elementor version: $LATEST_RELEASE"
          echo "Last known version: $LAST_KNOWN"

          if [ "$LATEST_RELEASE" != "$LAST_KNOWN" ]; then
            echo "New release detected!"
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          else
            echo "No new release"
            echo "new_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Get previous versions for testing
        if: steps.check.outputs.new_release == 'true'
        id: versions
        run: |
          # Get versions from WordPress.org
          VERSIONS=$(curl -s "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&slug=elementor" | \
            jq -r '.versions | to_entries | map(select(.key | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | map(.key) | sort_by(. | split(".") | map(tonumber)) | reverse | .[0:5]')

          CURRENT="${{ steps.check.outputs.version }}"

          # Find previous major/minor versions (not just patch versions)
          CURRENT_MAJOR_MINOR=$(echo "$CURRENT" | sed 's/\.[0-9]*$//')

          # Get all versions and find previous minor versions
          PREV_1=$(echo "$VERSIONS" | jq -r --arg cmm "$CURRENT_MAJOR_MINOR" '
            . as $all |
            map(select((. | split(".")[0:2] | join(".")) != $cmm)) |
            .[0] // ""
          ')

          if [ -z "$PREV_1" ]; then
            PREV_1=$(echo "$VERSIONS" | jq -r '.[1] // ""')
          fi

          # For previous-2, find another minor version
          PREV_1_MAJOR_MINOR=$(echo "$PREV_1" | sed 's/\.[0-9]*$//')
          PREV_2=$(echo "$VERSIONS" | jq -r --arg cmm "$CURRENT_MAJOR_MINOR" --arg pmm "$PREV_1_MAJOR_MINOR" '
            . as $all |
            map(select(
              ((. | split(".")[0:2] | join(".")) != $cmm) and
              ((. | split(".")[0:2] | join(".")) != $pmm)
            )) |
            .[0] // ""
          ')

          if [ -z "$PREV_2" ]; then
            PREV_2=$(echo "$VERSIONS" | jq -r '.[3] // .[2] // ""')
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous_1=$PREV_1" >> $GITHUB_OUTPUT
          echo "previous_2=$PREV_2" >> $GITHUB_OUTPUT

          echo "Versions to test: $CURRENT, $PREV_1, $PREV_2"

      - name: Update version tracking files
        if: steps.check.outputs.new_release == 'true'
        run: |
          # Update last known version
          echo "${{ steps.check.outputs.version }}" > .github/last-known-elementor-version.txt

          # Update versions JSON
          cat > .github/elementor-versions.json << EOF
          {
            "current": "${{ steps.versions.outputs.current }}",
            "previous_1": "${{ steps.versions.outputs.previous_1 }}",
            "previous_2": "${{ steps.versions.outputs.previous_2 }}",
            "last_checked": "$(date -u +%Y-%m-%d)",
            "test_status": {
              "${{ steps.versions.outputs.current }}": "pending",
              "${{ steps.versions.outputs.previous_1 }}": "pending",
              "${{ steps.versions.outputs.previous_2 }}": "pending"
            }
          }
          EOF

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .github/last-known-elementor-version.txt .github/elementor-versions.json
          git commit -m "Update Elementor version tracking to ${{ steps.check.outputs.version }}"
          git push

      - name: Create tracking issue and trigger tests
        if: steps.check.outputs.new_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.check.outputs.version }}';
            const prev1 = '${{ steps.versions.outputs.previous_1 }}';
            const prev2 = '${{ steps.versions.outputs.previous_2 }}';

            // Create issue for tracking
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test compatibility with Elementor ${version}`,
              body: `## New Elementor Version Released: ${version}

            A new version of Elementor has been detected. Automated compatibility tests are now running.

            ### Versions Being Tested
            - **Current**: ${version}
            - **Previous-1**: ${prev1}
            - **Previous-2**: ${prev2}

            ### Automated Test Checklist
            - [ ] Test environment setup with Elementor ${version}
            - [ ] Pull operations test
            - [ ] Push operations test
            - [ ] Search & replace test
            - [ ] Template operations test
            - [ ] URL rewriting test

            ### Manual Review Required
            - [ ] Review test results
            - [ ] Check for breaking changes in [Elementor changelog](https://wordpress.org/plugins/elementor/#developers)
            - [ ] Update compatibility matrix if tests pass
            - [ ] Create patch release if fixes needed

            Test results will be posted here when complete.`,
              labels: ['elementor-update', 'testing', 'automated']
            });

            console.log(`Created issue #${issue.data.number} for Elementor ${version}`);

            // Trigger the compatibility test workflow
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'elementor-compatibility-tests.yml',
                ref: 'main',
                inputs: {
                  elementor_version: version,
                  previous_1_version: prev1,
                  previous_2_version: prev2,
                  issue_number: issue.data.number.toString()
                }
              });
              console.log('Triggered compatibility tests workflow');
            } catch (error) {
              console.log('Could not trigger compatibility tests:', error.message);
            }
